name: "Run TODO to Issue"

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'docker/**'

  workflow_dispatch:
    inputs:
      MANUAL_COMMIT_REF:
        description: "Target commit SHA (usually current main)"
        required: true
      MANUAL_BASE_REF:
        description: "Base commit SHA (before the TODOs were added)"
        required: true
        
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}-${{ github.triggering_actor == 'auto-cid' || github.triggering_actor == 'github-actions[bot]' }}
  cancel-in-progress: true

        
jobs:
  build:
    if: github.triggering_actor != 'github-actions[bot]' && github.triggering_actor != 'auto-cid'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6

      - name: "TODO to Issue"
        uses: alstr/todo-to-issue-action@v5
        env:
          MANUAL_COMMIT_REF: ${{ inputs.MANUAL_COMMIT_REF }}
          MANUAL_BASE_REF: ${{ inputs.MANUAL_BASE_REF }}
        with:
          INSERT_ISSUE_URLS: "true"
          CLOSE_ISSUES: "true"
          IDENTIFIERS: >-
            [
              {"name": "TODO", "labels": ["todo"]},
              {"name": "FIXME", "labels": ["fixme"]}
            ]
         
      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "Automatically added Github issue links to todos"
          title: "TODO links added"
          body: |
            Updates the links between todo comments and github issues.

            Please review the changes before merging.
          branch: auto/todos
